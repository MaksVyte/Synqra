[package]
name = "synqra-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
yrs = "0.18"

[dev-dependencies]
tokio-test = "0.4"

# Optimized release build for the Docker image.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3